<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800;900&display=swap');

  :root {

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body, html {

    font-family: 'Nunito', sans-serif;

  /* Background Video */

  /* Main Layout */

  .login-section h2 {

  .input-group {

  .input-group input {
    width: 100%;

  /* ─── SPECULAR BUTTON CSS ─── */
  .specular-button {
    --sb-radius: 20px;
    --sb-tint: #ffffff;
    --sb-tint-opacity: 0;
    --sb-blur: 0px;
    --sb-text-color: #f5f5f5;
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: none;
    margin-top: 1rem;
    width: 100%;
    font-family: inherit;
    font-weight: 800;
    font-size: 1.25rem !important;
    padding: 1.25rem !important;
    letter-spacing: 0.02em;
    line-height: 1;
    color: var(--sb-text-color);
    background: color-mix(in srgb, var(--sb-tint) calc(var(--sb-tint-opacity) * 100%), transparent);
    border-radius: var(--sb-radius);
    backdrop-filter: blur(var(--sb-blur));
    -webkit-backdrop-filter: blur(var(--sb-blur));
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2), 0 12px 30px rgba(0, 0, 0, 0.4);
    cursor: pointer;
    outline: none;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  
  .specular-button:active {
    transform: scale(0.97);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1), 0 4px 10px rgba(0, 0, 0, 0.3);
  }
  
  .specular-button.is-disabled {
    opacity: 0.55;
    cursor: default;
    pointer-events: none;
  }
  
  .specular-button__fx {
    position: absolute;
    inset: -20px;
    pointer-events: none;
    z-index: 1;
  }
  
  .specular-button__fx canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
  
  .specular-button__label {
    position: relative;
    z-index: 2;
  }

  @media (max-width: 900px) {
    .glass-panel { flex-direction: column; height: 90vh; overflow-y: auto; }
    .about-section { border-right: none; border-bottom: 1px solid rgba(255,255,255,0.2); padding: 2rem; }
    .login-section { padding: 2rem; }
  }
</style>

<body>
<div class="video-bg">
  <video autoPlay loop muted playsInline src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260419_065931_e3ca7b53-d32e-4ad5-81de-dc9d6fcfda6d.mp4"></video>
</div>
<div class="overlay"></div>

<div id="root"></div>

<script type="text/babel" data-type="module">
import React, { useState, useEffect, useRef, useMemo, useCallback } from 'react';
import { createRoot } from 'react-dom/client';
import { Renderer, Program, Mesh, Triangle, Color } from 'ogl';

// --- SPECULAR BUTTON COMPONENT ---
const PAD = 20;
const VERT = `#version 300 es
in vec2 position;
void main() {
  gl_Position = vec4(position, 0.0, 1.0);
}`;

const FRAG = `#version 300 es
precision highp float;
uniform vec2 uCenter;
uniform vec2 uHalfSize;
uniform float uRadius;
uniform float uAngle;
uniform float uPx;
uniform vec3 uLineColor;
uniform vec3 uBaseColor;
uniform float uIntensity;
uniform float uShineSize;
uniform float uShineFade;
uniform float uThickness;
uniform float uBaseWidth;
out vec4 fragColor;

float sdRoundedRect(vec2 p, vec2 b, float r) {
  vec2 q = abs(p) - b + r;
  return length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - r;
}

float shapeSDF(vec2 p) { return sdRoundedRect(p, uHalfSize, uRadius); }

float gaussianLine(float d, float sigma) {
  float x = d / (sigma + 1e-6);
  float k = mix(1.0, 1.6, smoothstep(0.0, 1.5, x));
  return exp(-k * x * x);
}

void main() {
  vec2 p = gl_FragCoord.xy - uCenter;
  float d = shapeSDF(p);
  vec2 L = vec2(cos(uAngle), sin(uAngle));
  float base = (1.0 - smoothstep(0.0, uBaseWidth, abs(d))) * 0.45;
  vec2 nEll = normalize(p / (uHalfSize * uHalfSize) + 1e-6);
  float phi = acos(clamp(abs(dot(nEll, L)), 0.0, 1.0));
  float rim = 1.0 - smoothstep(uShineSize - uShineFade, uShineSize + uShineFade + 1e-4, phi);
  float line = gaussianLine(d, uThickness);
  float edgeClamp = 1.0 - smoothstep(0.5 * uPx, 3.0 * uPx, abs(d));
  float hi = line * rim * edgeClamp * uIntensity;
  vec3 col = uBaseColor * base + uLineColor * hi;
  float a = clamp(base + hi, 0.0, 1.0);
  fragColor = vec4(col, a);
}`;

const SpecularButton = ({
  children,
  size = 'lg',
  radius = 20,
  tint = '#ffffff',
  tintOpacity = 0,
  blur = 0,
  textColor = '#ffffff',
  lineColor = '#ffffff',
  baseColor = '#525252',
  intensity = 1,
  shineSize = 10,
  shineFade = 40,
  thickness = 1,
  speed = 0.35,
  followMouse = true,
  proximity = 250,
  autoAnimate = false,
  disabled = false,
  onClick,
  className = ''
}) => {
  const btnRef = useRef(null);
  const fxRef = useRef(null);
  const propsRef = useRef({});
  propsRef.current = { radius, lineColor, baseColor, intensity, shineSize, shineFade, thickness, speed, followMouse, proximity, autoAnimate };

  useEffect(() => {
    const btn = btnRef.current;
    const fx = fxRef.current;
    if (!btn || !fx) return;

    const dpr = window.devicePixelRatio || 1;
    const renderer = new Renderer({ alpha: true, premultipliedAlpha: true, antialias: true, dpr });
    const gl = renderer.gl;
    gl.clearColor(0, 0, 0, 0);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
    
    const geometry = new Triangle(gl);
    if (geometry.attributes.uv) delete geometry.attributes.uv;
    
    const program = new Program(gl, {
      vertex: VERT,
      fragment: FRAG,
      uniforms: {
        uCenter: { value: [0, 0] },
        uHalfSize: { value: [1, 1] },
        uRadius: { value: 0 },
        uAngle: { value: 2.4 },
        uPx: { value: dpr },
        uLineColor: { value: [1, 1, 1] },
        uBaseColor: { value: [0.32, 0.32, 0.32] },
        uIntensity: { value: 1 },
        uShineSize: { value: 0.17 },
        uShineFade: { value: 0.7 },
        uThickness: { value: 1 },
        uBaseWidth: { value: dpr }
      }
    });
    
    const mesh = new Mesh(gl, { geometry, program });
    fx.appendChild(gl.canvas);
    
    const sizeRef = { w: 1, h: 1 };
    const resize = () => {
      const rect = btn.getBoundingClientRect();
      const w = rect.width;
      const h = rect.height;
      sizeRef.w = w;
      sizeRef.h = h;
      renderer.setSize(w + PAD * 2, h + PAD * 2);
      program.uniforms.uCenter.value = [(PAD + w / 2) * dpr, (PAD + h / 2) * dpr];
      program.uniforms.uHalfSize.value = [(w / 2) * dpr, (h / 2) * dpr];
    };
    
    const ro = new ResizeObserver(resize);
    ro.observe(btn);
    resize();

    let pointerAngle = null;
    let proximityT = 0;
    const onPointerMove = e => {
      const rect = btn.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      const dx = Math.max(rect.left - e.clientX, 0, e.clientX - rect.right);
      const dy = Math.max(rect.top - e.clientY, 0, e.clientY - rect.bottom);
      const dist = Math.hypot(dx, dy);
      
      if (dist === 0) {
        const nx = (e.clientX - cx) / (rect.width / 2);
        const ny = (cy - e.clientY) / (rect.height / 2);
        pointerAngle = Math.atan2(2 / rect.height, -2 / rect.width) + nx * 0.3 + ny * 0.15;
      } else {
        pointerAngle = Math.atan2(cy - e.clientY, e.clientX - cx);
      }
      const t = Math.max(0, 1 - dist / Math.max(propsRef.current.proximity, 1));
      proximityT = t * t * (3 - 2 * t);
    };
    window.addEventListener('pointermove', onPointerMove);

    let angle = 2.4;
    let idleAngle = 2.4;
    let bright = 0;
    let last = performance.now();
    let raf = 0;
    const lineC = new Color();
    const baseC = new Color();
    
    const update = now => {
      raf = requestAnimationFrame(update);
      const dt = Math.min((now - last) / 1000, 0.05);
      last = now;
      const p = propsRef.current;
      idleAngle += p.speed * dt;
      const steer = p.followMouse && pointerAngle != null && (!p.autoAnimate || proximityT > 0);
      const target = steer ? pointerAngle : idleAngle;
      const diff = ((target - angle + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
      angle += diff * (1 - Math.exp(-dt * 7));
      const brightTarget = p.autoAnimate ? 1 : proximityT;
      bright += (brightTarget - bright) * (1 - Math.exp(-dt * 8));
      
      lineC.set(p.lineColor);
      baseC.set(p.baseColor);
      
      program.uniforms.uAngle.value = angle;
      program.uniforms.uRadius.value = Math.min(p.radius, Math.min(sizeRef.w, sizeRef.h) / 2) * dpr;
      program.uniforms.uLineColor.value = [lineC.r, lineC.g, lineC.b];
      program.uniforms.uBaseColor.value = [baseC.r, baseC.g, baseC.b];
      program.uniforms.uIntensity.value = p.intensity * bright;
      program.uniforms.uShineSize.value = (p.shineSize * Math.PI) / 180;
      program.uniforms.uShineFade.value = (p.shineFade * Math.PI) / 180;
      program.uniforms.uThickness.value = p.thickness * dpr;
      
      renderer.render({ scene: mesh });
    };
    raf = requestAnimationFrame(update);
    
    return () => {
      cancelAnimationFrame(raf);
      ro.disconnect();
      window.removeEventListener('pointermove', onPointerMove);
      if (gl.canvas.parentNode === fx) fx.removeChild(gl.canvas);
      gl.getExtension('WEBGL_lose_context')?.loseContext();
    };
  }, []);

  return (
    <div
      ref={btnRef}
      role="button"
      tabIndex={disabled ? -1 : 0}
      onClick={disabled ? undefined : onClick}
      onKeyDown={e => {
        if (!disabled && (e.key === 'Enter' || e.key === ' ')) {
          e.preventDefault();
          onClick && onClick(e);
        }
      }}
      className={`specular-button specular-button--${size} ${className} ${disabled ? 'is-disabled' : ''}`}
      style={{
        '--sb-radius': `${radius}px`,
        '--sb-tint': tint,
        '--sb-tint-opacity': tintOpacity,
        '--sb-blur': `${blur}px`,
        '--sb-text-color': textColor
      }}
    >
      <span ref={fxRef} className="specular-button__fx" aria-hidden="true" />
      <span className="specular-button__label">{children}</span>
    </div>
  );
};


// The API is a separate deployment/origin - see DOCUMENTATION.md.
// Swap this for the deployed API Space's https://*.hf.space URL in production.
const API_BASE_URL = "http://localhost:8000";

async function postJSON(path, data) {
  const response = await fetch(API_BASE_URL + path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(data),
  });
  const body = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(body.detail || 'Something went wrong');
  return body;
}

// --- MAIN APP COMPONENT ---
function App() {
  const [mode, setMode] = React.useState('login'); // 'login' | 'signup'
  const [userId, setUserId] = React.useState('');
  const [password, setPassword] = React.useState('');
  const [error, setError] = React.useState('');
  const [loading, setLoading] = React.useState(false);

  const handleStart = async () => {
    if (!userId || !password) {
      setError('Please fill in both fields.');
      return;
    }
    setError('');
    setLoading(true);
    try {
      if (mode === 'signup') {
        await postJSON('/api/auth/signup', { user_id: userId, password });
      }
      const loginRes = await postJSON('/api/auth/login', { user_id: userId, password });
      localStorage.setItem('eli5_token', loginRes.token);
      window.location.href = 'home.html';
    } catch (err) {
      setError(err.message);
      setLoading(false);
    }
  };

  return (
    <div className="glass-panel">
      <div className="about-section">
        <h1 className="multicolor-text">explain like i'm 5</h1>
        <p>Watch your complex text turn into clear, simple language.</p>
        <ul className="levels-list">
          <li>
            <div>
              <strong>Level 1: The Seed</strong><br/>
              Short words, zero jargon.
            </div>
          </li>
          <li>
            <div>
              <strong>Level 2: The Sprout</strong><br/>
              Clear, everyday language.
            </div>
          </li>
          <li>
            <div>
              <strong>Level 3: The Bloom</strong><br/>
              Full detail, beautifully refined.
            </div>
          </li>
        </ul>
      </div>
      
      <div className="login-section">
        <h2>{mode === 'login' ? 'Welcome Back' : 'Create Account'}</h2>

        <div className="input-group">
          <input
            type="text"
            placeholder="User ID"
            value={userId}
            onChange={e => setUserId(e.target.value)}
            disabled={loading}
          />
        </div>
        <div className="input-group">
          <input
            type="password"
            placeholder="Password"
            value={password}
            onChange={e => setPassword(e.target.value)}
            disabled={loading}
            onKeyDown={e => { if (e.key === 'Enter') handleStart(); }}
          />
        </div>

        {error && <div style={{ color: 'var(--error)', marginBottom: '1rem', fontWeight: 700 }}>{error}</div>}

        <SpecularButton
          size="lg"
          radius={20}
          tint="#5B7BCE"
          tintOpacity={0.3}
          blur={12}
          textColor="#ffffff"
          lineColor="#ffffff"   /* White shine to match the white flowers */
          baseColor="#4A90E2"   /* Sky blue base rim */
          intensity={1.5}
          thickness={2}
          disabled={loading}
          onClick={handleStart}
        >
          {loading ? '...' : mode === 'login' ? 'Log In' : 'Sign Up'}
        </SpecularButton>

        <button
          type="button"
          onClick={() => { setMode(mode === 'login' ? 'signup' : 'login'); setError(''); }}
          style={{ background: 'none', border: 'none', color: 'var(--text-main)', opacity: 0.8, marginTop: '1.5rem', cursor: 'pointer', textDecoration: 'underline', font: 'inherit', fontSize: '0.95rem' }}
        >
          {mode === 'login' ? "New here? Create an account" : "Already have an account? Log in"}
        </button>
      </div>
    </div>
  );
}

const root = createRoot(document.getElementById('root'));
root.render(<App />);
</script>

</body>
