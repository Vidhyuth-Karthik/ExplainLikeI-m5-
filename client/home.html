<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>explain like i'm 5</title>

<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
    "lucide-react": "https://esm.sh/lucide-react@0.292.0"
  }
}
</script>

<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800;900&display=swap');

  :root {
    --primary: #6C8DF0;
    --secondary: #87A96B;
    --accent: #F3C856;
    --pink: #DE92B1;
    --bg-glass: rgba(255, 255, 255, 0.15);
    --text-main: #ffffff;
    --error: #ff4d4d;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body, html {
    width: 100%;
    min-height: 100%;
    font-family: 'Nunito', sans-serif;
    color: var(--text-main);
    background: #111;
  }

  /* Background Video (Restored EXACTLY as index.html) */
  .video-bg {
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    z-index: 0;
  }
  .video-bg video {
    width: 100%; height: 100%;
    object-fit: cover;
  }
  .overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(10, 20, 30, 0.2);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    z-index: 1;
  }

  /* Layout */
  #root {
    position: relative;
    z-index: 2;
    padding: 2rem;
    max-width: 1000px; /* Matched to index.html glass panel size */
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  /* Glass Buttons (Restored to elegant theme) */
  button.glass-btn {
    font-family: 'Nunito', sans-serif;
    background: rgba(0, 0, 0, 0.3);
    border: 2px solid rgba(255, 255, 255, 0.3);
    color: var(--text-main);
    padding: 0.8rem 1.5rem;
    border-radius: 20px;
    font-weight: 800;
    font-size: 1rem;
    cursor: pointer;
    transition: all 0.3s ease;
    display: inline-flex;
    align-items: center;
    gap: 0.6rem;
    outline: none;
  }
  button.glass-btn:hover:not(:disabled) {
    border-color: var(--primary);
    background: rgba(0, 0, 0, 0.5);
    box-shadow: 0 0 15px rgba(108, 141, 240, 0.4);
    transform: translateY(-2px);
  }
  button.glass-btn:active:not(:disabled) {
    transform: translateY(0);
  }
  button.glass-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  /* Floating Top Bar */
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 2rem;
  }

  /* Workspace Panel (Restored EXACTLY as index.html glass-panel) */
  .workspace-panel {
    background: var(--bg-glass);
    border-radius: 32px;
    border: 2px solid rgba(255,255,255,0.3);
    box-shadow: 0 24px 60px rgba(0,0,0,0.3), inset 0 2px 20px rgba(255,255,255,0.4);
    padding: 2.5rem;
    margin-bottom: 2rem;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    animation: floatIn 1s cubic-bezier(0.2, 0.8, 0.2, 1);
  }

  @keyframes floatIn {
    0% { transform: translateY(40px) scale(0.95); opacity: 0; }
    100% { transform: translateY(0) scale(1); opacity: 1; }
  }

  .editor-container {
    position: relative;
    width: 100%;
    margin-bottom: 1.5rem;
  }

  /* Restored input styling from index.html */
  textarea, .highlight-preview {
    width: 100%;
    min-height: 250px;
    background: rgba(0, 0, 0, 0.3);
    border: 2px solid rgba(255,255,255,0.3);
    border-radius: 20px;
    padding: 1.5rem;
    color: white;
    font-family: inherit;
    font-size: 1.2rem;
    font-weight: 600;
    line-height: 1.6;
    resize: vertical;
    outline: none;
    transition: all 0.3s ease;
  }
  textarea::placeholder {
    color: rgba(255,255,255,0.6);
  }
  textarea:focus {
    border-color: var(--primary);
    background: rgba(0, 0, 0, 0.5);
    box-shadow: 0 0 15px rgba(108, 141, 240, 0.4);
  }
  
  .highlight-preview {
    display: none;
    white-space: pre-wrap;
    overflow-y: auto;
  }
  .highlight-mode textarea { display: none; }
  .highlight-mode .highlight-preview { display: block; }

  /* Soft kid-friendly highlighting but elegant */
  .hard-word {
    background: rgba(222, 146, 177, 0.3); /* Pink hint */
    border-bottom: 2px solid var(--pink);
    border-radius: 4px;
    padding: 0 4px;
    font-weight: 800;
  }

  .editor-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 2rem;
  }
  
  .word-count {
    font-size: 1rem;
    font-weight: 800;
    color: rgba(255,255,255,0.8);
    background: rgba(0,0,0,0.3);
    padding: 0.5rem 1.2rem;
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.2);
  }
  .word-count.error { color: var(--error); border-color: var(--error); }

  input[type="file"] { display: none; }

  /* Branch stage: the "explain like i'm 5" button forks into a slim
     regenerate button + a text panel once a result exists. */
  .branch-stage {
    display: flex;
    align-items: center;
    gap: 0rem;
    margin-top: 1rem;
    transition: gap 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  .branch-stage.branched {
    align-items: stretch;
    gap: 1rem;
  }

  .branch-stage .cta-button {
    margin-top: 0;
    flex: 1 1 auto;
    min-width: 0;
    transition: flex-grow 0.6s cubic-bezier(0.2, 0.8, 0.2, 1), flex-basis 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  .branch-stage.branched .cta-button {
    flex: 0 0 88px;
  }

  .branch-connector {
    flex: 0 0 0px;
    position: relative;
    align-self: stretch;
    overflow: visible;
    transition: flex-basis 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  .branch-stage.branched .branch-connector {
    flex-basis: 32px;
  }
  .branch-connector svg {
    position: absolute;
    top: 50%;
    left: 0;
    width: 100%;
    height: 60px;
    transform: translateY(-50%);
    overflow: visible;
  }
  .branch-connector .branch-line {
    fill: none;
    stroke: rgba(255,255,255,0.55);
    stroke-width: 2;
    stroke-linecap: round;
    stroke-dasharray: 50;
    stroke-dashoffset: 50;
    transition: stroke-dashoffset 0.5s ease 0.25s;
  }
  .branch-stage.branched .branch-connector .branch-line {
    stroke-dashoffset: 0;
  }
  .branch-connector .branch-node {
    fill: var(--accent);
    r: 0;
    transition: r 0.3s ease 0.55s;
  }
  .branch-stage.branched .branch-connector .branch-node {
    r: 4;
  }

  .branch-panel {
    flex: 0 1 0%;
    min-width: 0;
    opacity: 0;
    overflow: hidden;
    background: rgba(0,0,0,0.2);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 24px;
    transition: flex-grow 0.6s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.4s ease 0.3s;
    display: flex;
    flex-direction: column;
  }
  .branch-stage.branched .branch-panel {
    flex: 1 1 auto;
    opacity: 1;
  }

  .branch-panel-header {
    padding: 1rem 1.5rem;
    background: rgba(255,255,255,0.05);
    border-bottom: 1px solid rgba(255,255,255,0.1);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 1rem;
  }
  .branch-panel-header span {
    font-weight: 900;
    font-size: 1.05rem;
    color: var(--accent);
    white-space: nowrap;
  }

  .branch-panel-body {
    padding: 1.5rem;
    font-size: 1.1rem;
    line-height: 1.6;
    color: rgba(255,255,255,0.9);
    white-space: pre-wrap;
  }

  .branch-thinking {
    display: flex;
    align-items: center;
    gap: 0.7rem;
    font-weight: 700;
    color: rgba(255,255,255,0.85);
  }
  .branch-thinking .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--primary);
    animation: dotPulse 1.2s ease-in-out infinite;
  }
  .branch-thinking .dot:nth-child(2) { animation-delay: 0.15s; }
  .branch-thinking .dot:nth-child(3) { animation-delay: 0.3s; }
  @keyframes dotPulse {
    0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
    40% { transform: scale(1); opacity: 1; }
  }

  /* History Panel */
  .history-panel {
    position: fixed;
    top: 0; right: 0;
    width: 400px; height: 100vh;
    background: rgba(15, 25, 35, 0.85);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-left: 1px solid rgba(255,255,255,0.1);
    padding: 2rem;
    z-index: 100;
    transform: translateX(100%);
    transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
    overflow-y: auto;
  }
  .history-panel.open {
    transform: translateX(0);
  }
  .history-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 2rem;
  }
  .history-header h2 { font-size: 1.5rem; font-weight: 900; }
  
  .history-item {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px;
    padding: 1.2rem;
    margin-bottom: 1rem;
    cursor: pointer;
    transition: all 0.2s;
  }
  .history-item:hover { 
    background: rgba(255,255,255,0.15);
  }
  .history-item-date { font-size: 0.8rem; font-weight: 800; color: var(--accent); margin-bottom: 0.5rem; }
  .history-item-preview { font-size: 1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; color: rgba(255,255,255,0.8); }

  /* Primary CTA Button (static glass style, no shine animation) */
  .cta-button {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: none;
    margin-top: 1rem;
    width: 100%;
    font-family: inherit;
    font-weight: 800;
    font-size: 1.25rem;
    padding: 1.25rem;
    letter-spacing: 0.02em;
    line-height: 1;
    color: #ffffff;
    background: rgba(91, 123, 206, 0.3);
    border-radius: 20px;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2), 0 12px 30px rgba(0, 0, 0, 0.4);
    cursor: pointer;
    outline: none;
    transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.2s ease;
  }
  .cta-button:hover:not(:disabled) {
    background: rgba(91, 123, 206, 0.45);
  }
  .cta-button:active:not(:disabled) {
    transform: scale(0.97);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1), 0 4px 10px rgba(0, 0, 0, 0.3);
  }
  .cta-button:disabled {
    opacity: 0.55;
    cursor: default;
  }

  @media (max-width: 1000px) {
    .branch-stage.branched { flex-direction: column; }
    .branch-stage.branched .cta-button { flex-basis: auto; width: 100%; }
    .branch-connector { display: none; }
    .history-panel { width: 100%; }
    .top-bar { flex-direction: column; gap: 1rem; }
  }
</style>
</head>
<body>

<div class="video-bg">
  <video autoplay loop muted playsinline src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260419_065931_e3ca7b53-d32e-4ad5-81de-dc9d6fcfda6d.mp4"></video>
</div>
<div class="overlay"></div>

<div id="root"></div>

<script type="text/babel" data-type="module">
import React, { useState, useEffect, useRef } from 'react';
import { createRoot } from 'react-dom/client';
import { Upload, Download, Copy, History, X, Search, CheckCircle2, Home, RotateCw } from 'lucide-react';

// --- MAIN APP ---
const MAX_WORDS = 4000;

// The API is a separate deployment/origin - see DOCUMENTATION.md.
// Swap this for the deployed API Space's https://*.hf.space URL in production.
const API_BASE_URL = "http://localhost:8000";

const countWords = (str) => {
  return str.trim().split(/\s+/).filter(word => word.length > 0).length;
};

// Fun kid heuristic for "big words"
const highlightHardWords = (text) => {
  const words = text.split(/(\s+)/);
  return words.map((word, i) => {
    const cleanWord = word.replace(/[.,/#!$%^&*;:{}=\-_`~()]/g, "");
    if (cleanWord.length > 9) {
      return <span key={i} className="hard-word">{word}</span>;
    }
    return word;
  });
};

function App() {
  const [text, setText] = useState('');
  const [wordCount, setWordCount] = useState(0);
  const [highlightMode, setHighlightMode] = useState(false);
  const [loading, setLoading] = useState(false);
  const [result, setResult] = useState(null);
  const [error, setError] = useState('');

  // History
  const [history, setHistory] = useState([]);
  const [showHistory, setShowHistory] = useState(false);
  const fileInputRef = useRef(null);
  const [copied, setCopied] = useState(false);

  const branched = loading || !!result;

  useEffect(() => {
    const saved = localStorage.getItem('eli5_history');
    if (saved) {
      try { setHistory(JSON.parse(saved)); } catch (e) {}
    }
  }, []);

  useEffect(() => {
    const token = localStorage.getItem('eli5_token');
    if (!token) {
      window.location.href = 'index.html';
      return;
    }
    fetch(API_BASE_URL + '/api/auth/me', { headers: { Authorization: `Bearer ${token}` } })
      .then(res => { if (!res.ok) throw new Error('Not logged in'); })
      .catch(() => { window.location.href = 'index.html'; });
  }, []);

  const handleLogout = async () => {
    const token = localStorage.getItem('eli5_token');
    await fetch(API_BASE_URL + '/api/auth/logout', {
      method: 'POST',
      headers: token ? { Authorization: `Bearer ${token}` } : {},
    }).catch(() => {});
    localStorage.removeItem('eli5_token');
    window.location.href = 'index.html';
  };

  const handleTextChange = (e) => {
    const val = e.target.value;
    setText(val);
    const count = countWords(val);
    setWordCount(count);
    if (count > MAX_WORDS) {
      setError(`Woah! That's too many words (${count} / ${MAX_WORDS}). Can you make it shorter?`);
    } else {
      setError('');
    }
  };

  const handleFileUpload = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (evt) => {
      const content = evt.target.result;
      setText(content);
      setWordCount(countWords(content));
    };
    reader.readAsText(file);
    e.target.value = null;
  };

  const handleCopy = () => {
    if (!result) return;
    navigator.clipboard.writeText(result);
    setCopied(true);
    setTimeout(() => setCopied(false), 2000);
  };

  const handleDownload = () => {
    if (!result) return;
    const content = `--- YOUR STORY ---\n${text}\n\n--- EXPLAINED LIKE YOU'RE 5 ---\n${result}\n`;

    const blob = new Blob([content], { type: 'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `My_Simple_Story_${new Date().getTime()}.txt`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  const saveToHistory = (res) => {
    const newItem = {
      id: Date.now(),
      date: new Date().toLocaleString(),
      original: text,
      result: res
    };
    const newHistory = [newItem, ...history].slice(0, 10);
    setHistory(newHistory);
    localStorage.setItem('eli5_history', JSON.stringify(newHistory));
  };

  const loadHistoryItem = (item) => {
    setText(item.original);
    setWordCount(countWords(item.original));
    setResult(item.result);
    setLoading(false);
    setShowHistory(false);
  };

  const handleSimplify = async () => {
    if (wordCount === 0 || wordCount > MAX_WORDS) return;
    setLoading(true);
    setResult(null);
    setHighlightMode(false);
    setError('');

    try {
      const token = localStorage.getItem('eli5_token');
      const response = await fetch(API_BASE_URL + '/api/ai/simplify', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
        body: JSON.stringify({ text }),
      });
      const body = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(body.detail || 'Something went wrong');

      setResult(body.result);
      saveToHistory(body.result);
    } catch (err) {
      setError(err.message);
    } finally {
      setLoading(false);
    }
  };

  return (
    <>
      <div className="top-bar">
        <button className="glass-btn" onClick={handleLogout}>
          <Home size={18} /> Back Home
        </button>
        
        <div style={{ display: 'flex', gap: '1rem' }}>
          <button className="glass-btn" onClick={() => fileInputRef.current?.click()}>
            <Upload size={18} /> Pick a Text File
          </button>
          <input type="file" accept=".txt" ref={fileInputRef} onChange={handleFileUpload} />
          
          <button className="glass-btn" onClick={() => setShowHistory(true)}>
            <History size={18} /> Past Stories
          </button>
        </div>
      </div>

      <div className="workspace-panel">
        <div className={`editor-container ${highlightMode ? 'highlight-mode' : ''}`}>
          <textarea 
            placeholder="Type or paste your story here..." 
            value={text}
            onChange={handleTextChange}
            disabled={loading}
          />
          <div className="highlight-preview">
            {highlightMode ? highlightHardWords(text) : ''}
          </div>
        </div>

        <div className="editor-footer">
          <button 
            className="glass-btn"
            onClick={() => setHighlightMode(!highlightMode)}
            disabled={text.length === 0}
          >
            <Search size={18} /> 
            {highlightMode ? 'Go Back to Typing' : 'Find Big Words'}
          </button>
          
          <span className={`word-count ${wordCount > MAX_WORDS ? 'error' : ''}`}>
            {wordCount} / {MAX_WORDS} words
          </span>
        </div>

        {error && <div style={{ color: 'var(--error)', marginBottom: '1.5rem', fontWeight: 800, fontSize: '1.2rem', textAlign: 'center' }}>{error}</div>}

        <div className={`branch-stage ${branched ? 'branched' : ''}`}>
          <button
            className="cta-button"
            onClick={handleSimplify}
            disabled={wordCount === 0 || wordCount > MAX_WORDS || loading}
          >
            {branched ? <RotateCw size={22} /> : "explain like i'm 5"}
          </button>

          <div className="branch-connector" aria-hidden="true">
            <svg viewBox="0 0 100 60" preserveAspectRatio="none">
              <path className="branch-line" d="M 0 30 L 100 30" />
              <circle className="branch-node" cx="0" cy="30" />
            </svg>
          </div>

          <div className="branch-panel">
            <div className="branch-panel-header">
              <span>Explained Like You're 5</span>
              <div style={{ display: 'flex', gap: '0.5rem' }}>
                <button className="glass-btn" onClick={handleCopy} disabled={!result} style={{ padding: '0.5rem', borderRadius: '12px' }}>
                  {copied ? <CheckCircle2 size={16} color="var(--secondary)"/> : <Copy size={16}/>}
                </button>
                <button className="glass-btn" onClick={handleDownload} disabled={!result} style={{ padding: '0.5rem', borderRadius: '12px' }}>
                  <Download size={16}/>
                </button>
              </div>
            </div>
            <div className="branch-panel-body">
              {loading ? (
                <div className="branch-thinking">
                  <span className="dot"></span><span className="dot"></span><span className="dot"></span>
                  Thinking really hard...
                </div>
              ) : result}
            </div>
          </div>
        </div>
      </div>

      {/* History Panel */}
      <div className={`history-panel ${showHistory ? 'open' : ''}`}>
        <div className="history-header">
          <h2>Past Stories</h2>
          <button className="glass-btn" onClick={() => setShowHistory(false)} style={{ padding: '0.5rem', borderRadius: '12px' }}>
            <X size={20} />
          </button>
        </div>
        
        {history.length === 0 ? (
          <p style={{ color: 'rgba(255,255,255,0.7)', fontSize: '1.1rem', fontWeight: 600 }}>No stories saved yet!</p>
        ) : (
          history.map(item => (
            <div key={item.id} className="history-item" onClick={() => loadHistoryItem(item)}>
              <div className="history-item-date">{item.date}</div>
              <div className="history-item-preview">{item.original}</div>
            </div>
          ))
        )}
      </div>
    </>
  );
}

const root = createRoot(document.getElementById('root'));
root.render(<App />);
</script>

</body>
</html>
